[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-task-queue"
version = "0.1.0"
description = "Write-Ahead Log (WAL) crash-safe priority task queue, exponential backoff retries with full jitter, worker lease coordinator with heartbeat timeouts, and dead-letter queue (DLQ) triage manager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aipd506" }
]
keywords = ["task-queue", "priority-queue", "wal", "crash-resilient", "leases", "dlq", "jitter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
taskspool = "taskspool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskspool*"]
